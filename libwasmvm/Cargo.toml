[package]
name = "wasmvm"
version = "3.0.7-zk"
publish = false
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "Go bindings for cosmwasm contracts"
repository = "https://github.com/CosmWasm/wasmvm"
license = "Apache-2.0"
readme = "README.md"
exclude = [".gitignore"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["zk"]
zk = ["cosmwasm-std/zk", "cosmwasm-vm/zk"]
# This feature requires Rust nightly because it depends on the unstable backtrace feature.
backtraces = []

[dependencies]
cosmwasm-std = { path = "../../cosmwasm/packages/std", features = ["ibc2", "iterator", "staking", "stargate", "zk"] }
cosmwasm-vm = { package = "cosmwasm-vm", path = "../../cosmwasm/packages/vm", features = ["ibc2", "iterator", "staking", "stargate", "zk"] }
errno = "0.3.8"
hex = "0.4.3"
rmp-serde = "1.3.0"
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.91"
thiserror = "1.0.38"
time = { version = "0.3.36", features = ["formatting"] }
winnow = "0.7.14"
zk-cosmwasm = { package = "zk-cosmwasm", path = "../../cosmwasm/packages/zk" }
lean-stwo-dummy = { path = "./vendor/lean-stwo-dummy", features = ["real-stwo"] }

[build-dependencies]
cbindgen = "0.29.0"

[dev-dependencies]
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
tempfile = "3.4.0"

# the example is to allow us to compile a muslc static lib with the same codebase as we compile the
# normal dynamic libs (best workaround I could find to override crate-type on the command line)
[[example]]
name = "wasmvmstatic"
path = "src/examples/wasmvmstatic.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
debug = false
rpath = true
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = true
overflow-checks = true
